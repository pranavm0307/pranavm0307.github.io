<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ test.title }} - RBI Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
    .card { background: rgba(255,255,255,0.95); border-radius: 15px; margin-bottom: 20px; }
    .question-card { padding: 20px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; }
    .timer { font-size: 24px; font-weight: bold; text-align: center; color: #667eea; }
    .sidebar { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px; }
    textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
  </style>
</head>
<body>
  <input type="hidden" id="attemptId" value="{{ attempt_id }}">
  <input type="hidden" id="timeLimit" value="{{ test.time_limit }}">

  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card p-3 text-center">
          <h2>{{ test.title }}</h2>
          <p>{{ test.description or "Complete all questions" }}</p>
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-8">
        <div class="card p-3">
          {% for question in test.questions %}
          <div class="question-card">
            <h5>Question {{ question.question_order }}</h5>
            <p>{{ question.question_text }}</p>
            <textarea id="q{{ question.id }}" data-qid="{{ question.id }}" placeholder="Your answer..." oninput="countWords()"></textarea>
            <small class="text-muted" id="wc{{ question.id }}">0 words</small>
          </div>
          {% endfor %}
        </div>
      </div>
      
      <div class="col-md-4">
        <div class="sidebar">
          <h5>Timer</h5>
          <div class="timer" id="timer">{{ test.time_limit }}:00</div>
          
          <h6 class="mt-3">Progress</h6>
          <p>Total Words: <span id="totalWords">0</span></p>
          
          <button class="btn btn-primary w-100 mb-2" onclick="saveTest()">Save</button>
          <button class="btn btn-success w-100" onclick="submitTest()">Submit</button>
          
          <div id="status" class="mt-2 text-center">Ready</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var attemptId = document.getElementById('attemptId').value;
    var timeLimit = parseInt(document.getElementById('timeLimit').value);
    var timeLeft = timeLimit * 60;

    function startTimer() {
      setInterval(function() {
        timeLeft = timeLeft - 1;
        var mins = Math.floor(timeLeft / 60);
        var secs = timeLeft % 60;
        document.getElementById('timer').innerHTML = mins + ':' + (secs < 10 ? '0' : '') + secs;
        
        if (timeLeft <= 0) {
          alert('Time up!');
          submitTest();
        }
      }, 1000);
    }

    function countWords() {
      var total = 0;
      var textareas = document.querySelectorAll('textarea[data-qid]');
      
      for (var i = 0; i < textareas.length; i++) {
        var textarea = textareas[i];
        var qid = textarea.getAttribute('data-qid');
        var text = textarea.value;
        var words = text.trim().split(' ').filter(function(w) { return w.length > 0; });
        var count = words.length;
        
        document.getElementById('wc' + qid).innerHTML = count + ' words';
        total = total + count;
      }
      document.getElementById('totalWords').innerHTML = total;
    }

    function saveTest() {
      document.getElementById('status').innerHTML = 'Saving...';
      var textareas = document.querySelectorAll('textarea[data-qid]');
      
      for (var i = 0; i < textareas.length; i++) {
        var textarea = textareas[i];
        var qid = textarea.getAttribute('data-qid');
        var answer = textarea.value;
        
        fetch('/save_test_answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            attempt_id: parseInt(attemptId),
            question_id: parseInt(qid),
            answer_text: answer
          })
        });
      }
      
      document.getElementById('status').innerHTML = 'Saved';
    }

    function submitTest() {
      if (!confirm('Submit test?')) return;
      
      saveTest();
      
      setTimeout(function() {
        fetch('/submit_test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            attempt_id: parseInt(attemptId),
            time_taken: (timeLimit * 60) - timeLeft
          })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            alert('Submitted!');
            window.location.href = '/tests';
          } else {
            alert('Error: ' + data.error);
          }
        });
      }, 1000);
    }

    startTimer();
    setInterval(saveTest, 10000);
  </script>
</body>
</html>
